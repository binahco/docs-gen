[project]
name = "llm-docs-gen"
version = "0.1.0"
description = "docs-gen: sitio de documentación desde los ADRs del core — parser-io para el cuerpo, LLM validado solo para la narrativa (semana 12)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
docs-gen = "docs_gen.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_gen"]

[dependency-groups]
dev = ["pytest>=8,<9"]